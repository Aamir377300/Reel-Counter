name: ReelCounter
options:
  bundleIdPrefix: com.aamir
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
targets:
  ReelCounter:
    type: application
    platform: iOS
    sources:
      - path: ReelCounter
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aamir.reelcounter
        INFOPLIST_FILE: ReelCounter/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    entitlements:
      path: ReelCounter/ReelCounter.entitlements
    dependencies:
      - target: ReelCounterWidgets
        embed: true
  ReelCounterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ReelCounterWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aamir.reelcounter.widgets
        INFOPLIST_FILE: ReelCounterWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
schemes:
  ReelCounter:
    build:
      targets:
        ReelCounter: all
        ReelCounterWidgets: all
    run:
      config: Debug
